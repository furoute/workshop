<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1120" height="820" fill="#ffffff"/>
  <rect x="12" y="12" width="1096" height="796" rx="16" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="10 7"/>

  <text x="560" y="72" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a1a">Agent 使用浏览器 · 架构图</text>
  <text x="560" y="108" text-anchor="middle" font-size="22" fill="#555">Playwright + Chromium</text>

  <defs>
