  <path d="M 578 603 C 690 603, 690 251, 588 251" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="11 8" marker-end="url(#arrLoop)"/>
  <text x="716" y="392" font-size="32" font-weight="700" fill="#b45309">闭环</text>
  <text x="716" y="436" font-size="26" fill="#92400e">观察 → 执行 → 验证</text>
