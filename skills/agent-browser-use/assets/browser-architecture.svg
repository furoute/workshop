      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <g transform="rotate(-0.4 320 163)">
    <rect x="70" y="130" width="500" height="66" rx="13" fill="#f3f4f6" stroke="#2b2b2b" stroke-width="3"/>
    <text x="320" y="175" text-anchor="middle" font-size="33" font-weight="700" fill="#1a1a1a">用户 · 一句话任务</text>
  </g>
  <line x1="320" y1="200" x2="320" y2="222" stroke="#333" stroke-width="3.5" marker-end="url(#arr)"/>

  <g transform="rotate(0.3 320 251)">
    <rect x="70" y="218" width="500" height="66" rx="13" fill="#dbeafe" stroke="#2b2b2b" stroke-width="3"/>
    <text x="320" y="263" text-anchor="middle" font-size="33" font-weight="700" fill="#1a1a1a">LLM · Agent 大脑</text>
  </g>
  <line x1="320" y1="288" x2="320" y2="310" stroke="#333" stroke-width="3.5" marker-end="url(#arr)"/>

  <g transform="rotate(-0.3 320 339)">
    <rect x="70" y="306" width="500" height="66" rx="13" fill="#e0e7ff" stroke="#2b2b2b" stroke-width="3"/>
    <text x="320" y="351" text-anchor="middle" font-size="33" font-weight="700" fill="#1a1a1a">工具层 · MCP</text>
  </g>
  <line x1="320" y1="376" x2="320" y2="398" stroke="#333" stroke-width="3.5" marker-end="url(#arr)"/>

  <g transform="rotate(0.4 320 427)">
    <rect x="70" y="394" width="500" height="66" rx="13" fill="#dcfce7" stroke="#2b2b2b" stroke-width="3"/>
    <text x="320" y="439" text-anchor="middle" font-size="33" font-weight="700" fill="#1a1a1a">Playwright · 动手</text>
  </g>
  <line x1="320" y1="464" x2="320" y2="486" stroke="#333" stroke-width="3.5" marker-end="url(#arr)"/>

  <g transform="rotate(-0.3 320 515)">
    <rect x="70" y="482" width="500" height="66" rx="13" fill="#ffedd5" stroke="#2b2b2b" stroke-width="3"/>
    <text x="320" y="527" text-anchor="middle" font-size="33" font-weight="700" fill="#1a1a1a">Chromium · 网页</text>
  </g>
  <line x1="320" y1="552" x2="320" y2="574" stroke="#333" stroke-width="3.5" marker-end="url(#arr)"/>

  <g transform="rotate(0.3 320 603)">
    <rect x="70" y="570" width="500" height="66" rx="13" fill="#fce7f3" stroke="#2b2b2b" stroke-width="3"/>
