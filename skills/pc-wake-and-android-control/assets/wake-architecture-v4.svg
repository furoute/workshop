<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">电脑之间互相唤醒架构图 v3</title>
  <desc id="diagram-desc">人在手机上用 WiFi 下单，上网本常开接单后开智能插座让台式机通电自启，再经 SSH 接管台式机发魔术包唤醒笔记本；魔术包为 6 字节 FF 加目标 MAC 重复 16 次，二层广播，只认自己的 MAC。</desc>

  <defs>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.2" fill="#30363d" opacity="0.52"/>
    </pattern>

    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a78bfa"/>
    </marker>

    <style>
      svg {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
        color: #e6edf3;
      }
      .mono { font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 64px; font-weight: 800; letter-spacing: -1.1px; }
      .subtitle { fill: #a8b3bf; font-size: 23px; font-weight: 550; }
      .zone-label { font-size: 30px; font-weight: 750; }
      .zone-sub { fill: #a6b0bc; font-size: 23.5px; font-weight: 550; }
      .node-title { font-size: 34px; font-weight: 800; letter-spacing: -0.3px; }
      .node-sub { fill: #d5dde5; font-size: 25px; font-weight: 650; }
      .node-fine { fill: #aab4bf; font-size: 23.5px; font-weight: 550; }
      .edge-label { font-size: 23.5px; font-weight: 700; paint-order: stroke; }
      .legend { fill: #d5dde5; font-size: 23.5px; font-weight: 600; }
      .footnote { fill: #a6b0bc; font-size: 23.5px; font-weight: 550; }
      .zone {
        fill: #0b1220;
        fill-opacity: 0.28;
        stroke: #d29922;
        stroke-opacity: 0.58;
        stroke-width: 1.5;
        stroke-dasharray: 9 7;
      }
      .node { stroke-width: 2; }
      .badge-text { font-size: 20px; font-weight: 750; text-anchor: middle; dominant-baseline: middle; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label-bg {
        fill: #0d1117;
        fill-opacity: 0.98;
        stroke: #30363d;
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#0d1117"/>
  <rect width="1600" height="1200" fill="url(#dot-grid)"/>

  <g id="header">
    <rect x="64" y="34" width="280" height="44" rx="22" fill="#13212c" stroke="#38bdf8" stroke-opacity="0.65"/>
    <circle cx="92" cy="56" r="5" fill="#67e8f9"/>
    <text x="110" y="63" class="mono" font-size="20" font-weight="700" fill="#67e8f9" letter-spacing="1.5">ARCHITECTURE · V3</text>
    <text x="62" y="123" class="title"><tspan>电脑之间</tspan><tspan fill="#fbbf24">互相唤醒</tspan><tspan> · 架构图</tspan></text>
    <text x="64" y="160" class="subtitle">无网线通路走智能插座，有线可达走 WoL</text>

    <rect x="1020" y="43" width="516" height="48" rx="24" fill="#111827" stroke="#30363d"/>
    <circle cx="1048" cy="67" r="5.5" fill="#34d399"/>
    <text x="1068" y="74" class="mono" font-size="20" font-weight="650" fill="#d5dde5" letter-spacing="0.8">SMART PLUG + WOL · SAME LAN</text>
  </g>

  <g id="zones">
    <rect x="48" y="205" width="378" height="930" rx="20" class="zone"/>
    <rect x="552" y="205" width="502" height="930" rx="20" class="zone"/>
    <rect x="1170" y="205" width="382" height="930" rx="20" class="zone"/>
  </g>

  <g id="zone-headers">
    <g aria-label="入口分区">
      <rect x="72" y="226" width="44" height="32" rx="8" fill="#13212c" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="94" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#67e8f9">01</text>
      <text x="128" y="252" class="zone-label" fill="#67e8f9">入口</text>
      <text x="72" y="285" class="zone-sub">发出指令 · 常开接单</text>
    </g>

    <g aria-label="第一跳分区">
      <rect x="576" y="226" width="44" height="32" rx="8" fill="#2a2110" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="598" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#fbbf24">02</text>
      <text x="632" y="252" class="zone-label" fill="#fbbf24">第一跳 · 智能插座</text>
      <text x="576" y="285" class="zone-sub">无网线通路时用这条 · 断电自启</text>
    </g>

    <g aria-label="第二跳分区">
      <rect x="1194" y="226" width="44" height="32" rx="8" fill="#0d201d" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="1216" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#34d399">03</text>
      <text x="1250" y="252" class="zone-label" fill="#34d399">第二跳 · 网线 WoL</text>
      <text x="1194" y="285" class="zone-sub">有线可达时用这条 · 魔术包</text>
    </g>
  </g>

  <g id="node-user" aria-label="用户">
    <rect x="68" y="326" width="330" height="200" rx="18" fill="#0d1b24" stroke="#38bdf8" stroke-opacity="0.92" class="node"/>
    <rect x="68" y="326" width="5" height="200" rx="2.5" fill="#67e8f9"/>
    <circle cx="100" cy="376" r="27" fill="#102a35" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="100" cy="368" r="10" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
    <path d="M82 397 C87 381 113 381 118 397" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="158" y="384" class="node-title" fill="#f8fafc">用户</text>
    <text x="158" y="424" class="node-sub">语音 / 文字</text>
    <text x="158" y="452" class="node-sub">手机 WiFi 下单</text>
    <text x="158" y="486" class="node-fine">人在哪都能叫</text>
    <text x="158" y="514" class="node-fine">不用去按电源键</text>
  </g>

  <g id="node-netbook" aria-label="上网本">
    <rect x="68" y="596" width="330" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <rect x="90" y="612" width="64" height="64" rx="16" fill="#102d29" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="122" y="652" class="mono badge-text" fill="#34d399">常开</text>
    <text x="176" y="644" class="node-title" fill="#f8fafc">上网本</text>
    <text x="170" y="680" class="node-sub">Ubuntu · 常开</text>
    <text x="170" y="708" class="node-sub">智能体接单</text>
    <text x="170" y="742" class="node-fine">SSH 接管台式机</text>
    <text x="170" y="770" class="node-fine">收到指令就干活</text>
  </g>

  <g id="note-common" aria-label="共同前提">
    <rect x="68" y="866" width="330" height="200" rx="18" fill="#0d1b24" stroke="#38bdf8" stroke-opacity="0.92" class="node"/>
    <text x="86" y="914" class="node-title" fill="#f8fafc">共同前提</text>
    <text x="86" y="950" class="node-sub">ErP Ready = Disabled，</text>
    <text x="86" y="978" class="node-sub">两条路共同的坎。</text>
    <text x="86" y="1012" class="node-fine">开着它，关机就断电，</text>
    <text x="86" y="1040" class="node-fine">插座和魔术包都失效。</text>
  </g>

  <g id="node-plug" aria-label="智能插座">
    <rect x="632" y="326" width="342" height="190" rx="18" fill="#241d0c" stroke="#fbbf24" stroke-opacity="0.92" class="node"/>
    <rect x="654" y="342" width="64" height="64" rx="16" fill="#33280e" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="686" y="382" class="mono badge-text" fill="#fbbf24">插座</text>
    <text x="740" y="374" class="node-title" fill="#f8fafc">智能插座</text>
    <text x="734" y="410" class="node-sub">WiFi 控制通断</text>
    <text x="734" y="438" class="node-sub">断上电管理 = 开启</text>
    <text x="734" y="472" class="node-fine">断电再通电才起效</text>
    <text x="734" y="500" class="node-fine">选“记忆”档会不给电</text>
  </g>

  <g id="node-desktop" aria-label="台式机">
    <rect x="632" y="596" width="342" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <rect x="654" y="612" width="64" height="64" rx="16" fill="#102d29" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="686" y="652" class="mono badge-text" fill="#34d399">Win11</text>
    <text x="740" y="644" class="node-title" fill="#f8fafc">台式机</text>
    <text x="734" y="680" class="node-sub">Win11 · 通电自启</text>
    <text x="734" y="708" class="node-sub">再发魔术包唤笔记本</text>
    <text x="734" y="742" class="node-fine">AC 恢复 = Power On</text>
    <text x="734" y="770" class="node-fine">上网本 SSH 接管</text>
  </g>

  <g id="note-rhythm" aria-label="操作节奏">
    <rect x="632" y="866" width="342" height="200" rx="18" fill="#241d0c" stroke="#fbbf24" stroke-opacity="0.92" class="node"/>
    <text x="652" y="914" class="node-title" fill="#f8fafc">操作节奏</text>
    <text x="652" y="950" class="node-sub">关机 → 灯灭 → 等 10 秒</text>
    <text x="652" y="978" class="node-sub">断电 → 等 ≥30 秒 → 通电</text>
    <text x="652" y="1012" class="node-fine">插座断上电管理 = 开启</text>
    <text x="652" y="1040" class="node-fine">选“记忆”档会不给电</text>
  </g>

  <g id="node-magic" aria-label="魔术包">
    <rect x="1198" y="326" width="322" height="190" rx="18" fill="#19182b" stroke="#a78bfa" stroke-opacity="0.92" class="node"/>
    <rect x="1218" y="342" width="62" height="62" rx="16" fill="#221d3b" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="1249" y="382" class="mono badge-text" fill="#a78bfa">FF×6</text>
    <text x="1286" y="374" class="node-title" fill="#f8fafc">魔术包</text>
    <text x="1286" y="410" class="node-sub">6 × FF + MAC × 16</text>
    <text x="1286" y="438" class="node-sub">共 102 字节</text>
    <text x="1286" y="472" class="node-fine">二层广播 · 端口 7 / 9</text>
    <text x="1286" y="500" class="node-fine">只认自己的 MAC</text>
  </g>

  <g id="node-laptop" aria-label="笔记本">
    <rect x="1198" y="596" width="322" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <rect x="1218" y="612" width="62" height="62" rx="16" fill="#102d29" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="1249" y="652" class="mono badge-text" fill="#34d399">WoL</text>
    <text x="1286" y="644" class="node-title" fill="#f8fafc">笔记本</text>
    <text x="1286" y="680" class="node-sub">双系统 · 必须插电</text>
    <text x="1286" y="708" class="node-sub">有线网卡 · wol g</text>
    <text x="1286" y="742" class="node-fine">收到魔术包就开机</text>
    <text x="1286" y="770" class="node-fine">合盖要改 logind.conf</text>
  </g>

  <g id="note-matrix" aria-label="实测矩阵">
    <rect x="1198" y="866" width="322" height="200" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <text x="1216" y="914" class="node-title" fill="#f8fafc">实测矩阵</text>
    <text x="1216" y="950" class="node-sub">六条路径，全部通过。</text>
    <text x="1216" y="978" class="node-sub">直连 / 路由器 LAN 口</text>
    <text x="1216" y="1012" class="node-fine">笔记本不插电是唯一失败。</text>
    <circle cx="1228" cy="1040" r="5" fill="#67e8f9"/>
    <text x="1246" y="1048" class="legend">语音</text>
    <circle cx="1310" cy="1040" r="5" fill="#fbbf24"/>
    <text x="1328" y="1048" class="legend">插座</text>
    <circle cx="1400" cy="1040" r="5" fill="#34d399"/>
    <text x="1418" y="1048" class="legend">魔术包</text>
  </g>

  <g id="connectors" aria-label="系统连接关系">
    <line x1="233" y1="526" x2="233" y2="596" class="connector" stroke="#67e8f9"
          marker-end="url(#arrow-cyan)"/>
    <rect x="158" y="530" width="150" height="44" rx="10" class="label-bg"/>
    <text x="233" y="559" text-anchor="middle" class="edge-label" fill="#67e8f9">语音指令</text>

    <line x1="398" y1="691" x2="632" y2="691" class="connector" stroke="#fbbf24"
          marker-end="url(#arrow-gold)"/>
    <rect x="455" y="669" width="150" height="44" rx="10" class="label-bg"/>
    <text x="530" y="698" text-anchor="middle" class="edge-label" fill="#fbbf24">开插座</text>

    <line x1="803" y1="516" x2="803" y2="596" class="connector" stroke="#fbbf24"
          marker-end="url(#arrow-gold)"/>
    <rect x="728" y="530" width="150" height="44" rx="10" class="label-bg"/>
    <text x="803" y="559" text-anchor="middle" class="edge-label" fill="#fbbf24">通电自启</text>

    <line x1="974" y1="691" x2="1198" y2="691" class="connector" stroke="#34d399"
          marker-end="url(#arrow-green)"/>
    <rect x="1000" y="669" width="160" height="44" rx="10" class="label-bg"/>
    <text x="1080" y="698" text-anchor="middle" class="edge-label" fill="#34d399">发魔术包</text>

    <line x1="1359" y1="516" x2="1359" y2="596" class="connector" stroke="#34d399"
          marker-end="url(#arrow-green)"/>
    <rect x="1368" y="530" width="136" height="44" rx="10" class="label-bg"/>
    <text x="1436" y="559" text-anchor="middle" class="edge-label" fill="#34d399">唤醒</text>
  </g>

  
</svg>
