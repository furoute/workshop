<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">ADB 控制安卓手机架构图 v3（大字号脱敏版）</title>
  <desc id="diagram-desc">用户通过语音或文字向 Codex 下达指令，Codex 经 MCP stdio 调用 scrcpy-mcp，scrcpy-mcp 使用 adb 命令访问本机 ADB Server，再通过 USB 与手机 adbd 双向连接；scrcpy-mcp 推送并启动 scrcpy-server，由 adbd 在手机系统内执行。</desc>

  <defs>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.2" fill="#30363d" opacity="0.52"/>
    </pattern>

    <marker id="arrow-user" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-agent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-mcp" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-adb" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-phone" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fb7185"/>
    </marker>

    <style>
      svg {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
        color: #e6edf3;
      }
      .mono { font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 64px; font-weight: 800; letter-spacing: -1.1px; }
      .subtitle { fill: #a8b3bf; font-size: 23px; font-weight: 550; }
      .zone-label { font-size: 30px; font-weight: 750; }
      .zone-sub { fill: #a6b0bc; font-size: 23.5px; font-weight: 550; }
      .node-title { font-size: 34px; font-weight: 800; letter-spacing: -0.3px; }
      .node-sub { fill: #d5dde5; font-size: 25px; font-weight: 650; }
      .node-fine { fill: #aab4bf; font-size: 23.5px; font-weight: 550; }
      .edge-label { font-size: 23.5px; font-weight: 700; paint-order: stroke; }
      .legend { fill: #d5dde5; font-size: 23.5px; font-weight: 600; }
      .footnote { fill: #a6b0bc; font-size: 23.5px; font-weight: 550; }
      .zone {
        fill: #0b1220;
        fill-opacity: 0.28;
        stroke: #d29922;
        stroke-opacity: 0.58;
        stroke-width: 1.5;
        stroke-dasharray: 9 7;
      }
      .node { stroke-width: 2; }
      .badge-text { font-size: 20px; font-weight: 750; text-anchor: middle; dominant-baseline: middle; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label-bg {
        fill: #0d1117;
        fill-opacity: 0.98;
        stroke: #30363d;
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#0d1117"/>
  <rect width="1600" height="1200" fill="url(#dot-grid)"/>

  <g id="header">
    <rect x="64" y="34" width="280" height="44" rx="22" fill="#13212c" stroke="#38bdf8" stroke-opacity="0.65"/>
    <circle cx="92" cy="56" r="5" fill="#67e8f9"/>
    <text x="110" y="63" class="mono" font-size="20" font-weight="700" fill="#67e8f9" letter-spacing="1.5">ARCHITECTURE · V3</text>
    <text x="62" y="123" class="title"><tspan fill="#fbbf24">ADB</tspan><tspan> 控制安卓手机 · 架构图</tspan></text>
    <text x="64" y="160" class="subtitle">从用户意图到手机内执行的一条可复现控制链路</text>

    <rect x="1020" y="43" width="516" height="48" rx="24" fill="#111827" stroke="#30363d"/>
    <circle cx="1048" cy="67" r="5.5" fill="#34d399"/>
    <text x="1068" y="74" class="mono" font-size="20" font-weight="650" fill="#d5dde5" letter-spacing="0.8">LOCAL LINK · USB · DEVICE-AGNOSTIC</text>
  </g>

  <g id="zones">
    <rect x="48" y="205" width="378" height="930" rx="20" class="zone"/>
    <rect x="552" y="205" width="502" height="930" rx="20" class="zone"/>
    <rect x="1170" y="205" width="382" height="930" rx="20" class="zone"/>
  </g>

  <g id="zone-headers">
    <g aria-label="用户侧分区">
      <rect x="72" y="226" width="44" height="32" rx="8" fill="#13212c" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="94" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#67e8f9">01</text>
      <text x="128" y="252" class="zone-label" fill="#67e8f9">用户侧</text>
      <text x="72" y="285" class="zone-sub">发出意图 · 验收结果</text>
    </g>

    <g aria-label="控制端分区">
      <rect x="576" y="226" width="44" height="32" rx="8" fill="#2a2110" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="598" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#fbbf24">02</text>
      <text x="632" y="252" class="zone-label" fill="#fbbf24">控制端</text>
      <text x="576" y="285" class="zone-sub">本地执行环境 · 通用能力视图</text>
    </g>

    <g aria-label="手机端分区">
      <rect x="1194" y="226" width="44" height="32" rx="8" fill="#2b151b" stroke="#fb7185" stroke-opacity="0.6"/>
      <text x="1216" y="249" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#fb7185">03</text>
      <text x="1250" y="252" class="zone-label" fill="#fb7185">手机端</text>
      <text x="1194" y="285" class="zone-sub">安卓运行时 · 机型与厂商无关</text>
    </g>
  </g>

  <g id="node-user" aria-label="用户">
    <rect x="68" y="326" width="330" height="200" rx="18" fill="#0d1b24" stroke="#38bdf8" stroke-opacity="0.92" class="node"/>
    <rect x="68" y="326" width="5" height="200" rx="2.5" fill="#67e8f9"/>
    <circle cx="100" cy="376" r="27" fill="#102a35" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="100" cy="368" r="10" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
    <path d="M82 397 C87 381 113 381 118 397" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="158" y="384" class="node-title" fill="#f8fafc">用户</text>
    <text x="158" y="424" class="node-sub">语音 / 文字</text>
    <text x="158" y="452" class="node-sub">下达控制目标</text>
    <text x="158" y="486" class="node-fine">查看实时画面</text>
    <text x="158" y="514" class="node-fine">验收最终结果</text>
  </g>

  <g id="user-interactions">
    <text x="72" y="592" class="mono" font-size="20" font-weight="700" fill="#67e8f9" letter-spacing="1.2">INTERACTION SIGNALS</text>
    <rect x="68" y="620" width="330" height="64" rx="12" fill="#0f172a" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="92" cy="652" r="5" fill="#67e8f9"/>
    <text x="110" y="660" class="node-sub">自然语言指令</text>
    <rect x="68" y="706" width="330" height="64" rx="12" fill="#0f172a" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="92" cy="738" r="5" fill="#67e8f9"/>
    <text x="110" y="746" class="node-sub">语音输入</text>
    <rect x="68" y="792" width="330" height="64" rx="12" fill="#0f172a" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="92" cy="824" r="5" fill="#67e8f9"/>
    <text x="110" y="832" class="node-sub">实时画面反馈</text>
  </g>

  <g id="user-note">
    <rect x="68" y="890" width="330" height="200" rx="14" fill="#0b1220" stroke="#30363d" stroke-dasharray="6 5" stroke-width="1.2"/>
    <text x="86" y="932" class="mono" font-size="20" font-weight="700" fill="#aab4bf" letter-spacing="1">PORTABLE BY DESIGN</text>
    <text x="86" y="974" class="node-fine">以通用能力描述链路，</text>
    <text x="86" y="1004" class="node-fine">不绑定特定设备或账号。</text>
    <text x="86" y="1034" class="node-fine" fill="#67e8f9">可迁移到任意安卓手机，</text>
    <text x="86" y="1064" class="node-fine" fill="#67e8f9">不改变控制语义。</text>
  </g>

  <g id="node-codex" aria-label="Codex AI agent">
    <rect x="632" y="326" width="342" height="190" rx="18" fill="#0d201d" stroke="#34d399" stroke-opacity="0.92" class="node"/>
    <rect x="654" y="342" width="64" height="64" rx="16" fill="#102d29" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="686" y="382" class="mono badge-text" fill="#34d399">&lt;/&gt;</text>
    <text x="740" y="374" class="node-title" fill="#f8fafc">Codex</text>
    <text x="734" y="410" class="node-sub">AI agent · 理解目标</text>
    <text x="734" y="438" class="node-sub">编排工具</text>
    <text x="734" y="472" class="node-fine">检查执行结果</text>
    <text x="734" y="500" class="node-fine">生成可执行控制步骤</text>
  </g>

  <g id="node-scrcpy-mcp" aria-label="scrcpy-mcp">
    <rect x="632" y="596" width="342" height="190" rx="18" fill="#19182b" stroke="#a78bfa" stroke-opacity="0.92" class="node"/>
    <rect x="654" y="612" width="64" height="64" rx="16" fill="#221d3b" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="686" y="652" class="mono badge-text" fill="#a78bfa">MCP</text>
    <text x="740" y="644" class="node-title" fill="#f8fafc">scrcpy-mcp</text>
    <text x="734" y="680" class="node-sub">MCP · Node 24+</text>
    <text x="734" y="708" class="node-sub">设备发现 · 画面控制</text>
    <text x="734" y="742" class="node-fine">44 个工具 · 键鼠输入</text>
    <text x="734" y="770" class="node-fine">封装为可调用工具</text>
  </g>

  <g id="node-adb-server" aria-label="ADB Server">
    <rect x="632" y="866" width="342" height="190" rx="18" fill="#241d0c" stroke="#fbbf24" stroke-opacity="0.92" class="node"/>
    <rect x="654" y="882" width="64" height="64" rx="16" fill="#33280e" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="686" y="922" class="mono badge-text" fill="#fbbf24">5037</text>
    <text x="740" y="914" class="node-title" fill="#f8fafc">ADB Server</text>
    <text x="734" y="950" class="node-sub">本地 5037 · USB 中转</text>
    <text x="734" y="978" class="node-sub">管理连接 · 转发通道</text>
    <text x="734" y="1012" class="node-fine">维护授权状态</text>
    <text x="734" y="1040" class="node-fine">提供本机控制入口</text>
  </g>

  <g id="control-note">
    <rect x="632" y="1068" width="342" height="60" rx="12" fill="#0b1220" stroke="#30363d" stroke-width="1.2"/>
    <path d="M650 1086 h12 M650 1095 h12 M650 1104 h12" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
    <text x="674" y="1093" class="node-fine">本机链路：MCP stdio + USB</text>
    <text x="674" y="1119" class="node-fine">不暴露公网服务或固定设备身份</text>
  </g>

  <g id="phone-device">
    <rect x="1184" y="326" width="354" height="740" rx="34" fill="#0b1220" stroke="#30363d" stroke-width="1.5"/>
    <rect x="1340" y="326" width="44" height="10" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="1210" y="384" class="mono" font-size="20" font-weight="700" fill="#aab4bf" letter-spacing="1">DEVICE BOUNDARY</text>
    <line x1="1370" y1="377" x2="1514" y2="377" stroke="#30363d" stroke-width="1.2"/>
    <text x="1210" y="415" class="node-fine">安卓系统内运行时</text>
  </g>

  <g id="node-scrcpy-server" aria-label="scrcpy-server">
    <rect x="1198" y="430" width="322" height="180" rx="18" fill="#29171c" stroke="#fb7185" stroke-opacity="0.92" class="node"/>
    <rect x="1218" y="448" width="62" height="62" rx="16" fill="#381e25" stroke="#fb7185" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="1249" y="486" class="mono badge-text" fill="#fb7185">H.264</text>
    <text x="1286" y="470" class="node-title" fill="#f8fafc">scrcpy-server</text>
    <text x="1286" y="506" class="node-sub">MediaCodec · H.264</text>
    <text x="1286" y="534" class="node-sub">视频流</text>
    <text x="1286" y="566" class="node-fine">画面编码</text>
    <text x="1286" y="594" class="node-fine">触控 / 键鼠事件投递</text>
  </g>

  <g id="node-adbd" aria-label="adbd">
    <rect x="1198" y="700" width="322" height="180" rx="18" fill="#29171c" stroke="#fb7185" stroke-opacity="0.92" class="node"/>
    <rect x="1218" y="718" width="62" height="62" rx="16" fill="#381e25" stroke="#fb7185" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="1249" y="756" class="mono badge-text" fill="#fb7185">adbd</text>
    <text x="1292" y="740" class="node-title" fill="#f8fafc">adbd</text>
    <text x="1292" y="776" class="node-sub">手机内守护进程</text>
    <text x="1292" y="804" class="node-sub">接受 ADB 命令</text>
    <text x="1292" y="836" class="node-fine">USB 执行 · RSA 授权</text>
    <text x="1292" y="864" class="node-fine">启动目标进程</text>
  </g>

  <g id="connectors" aria-label="系统连接关系">
    <line x1="398" y1="426" x2="632" y2="426" class="connector" stroke="#67e8f9"
          marker-start="url(#arrow-user)" marker-end="url(#arrow-user)"/>
    <rect x="452" y="388" width="150" height="76" rx="10" class="label-bg"/>
    <text x="527" y="416" text-anchor="middle" class="edge-label" fill="#67e8f9">下指令</text>
    <text x="527" y="446" text-anchor="middle" class="edge-label" fill="#67e8f9">看结果</text>

    <line x1="803" y1="516" x2="803" y2="596" class="connector" stroke="#34d399"
          marker-end="url(#arrow-agent)"/>
    <rect x="728" y="532" width="150" height="44" rx="10" class="label-bg"/>
    <text x="803" y="561" text-anchor="middle" class="edge-label" fill="#34d399">MCP stdio</text>

    <line x1="803" y1="786" x2="803" y2="866" class="connector" stroke="#a78bfa"
          marker-end="url(#arrow-mcp)"/>
    <rect x="728" y="802" width="150" height="44" rx="10" class="label-bg"/>
    <text x="803" y="831" text-anchor="middle" class="edge-label" fill="#a78bfa">adb 命令</text>

    <path d="M974 691 H1080 V520 H1198" class="connector" stroke="#a78bfa"
          marker-end="url(#arrow-mcp)"/>
    <rect x="1000" y="640" width="160" height="44" rx="10" class="label-bg"/>
    <text x="1080" y="669" text-anchor="middle" class="edge-label" fill="#a78bfa">推 JAR · 启动</text>

    <path d="M974 961 H1135 V790 H1198" class="connector" stroke="#fbbf24"
          marker-start="url(#arrow-adb)" marker-end="url(#arrow-adb)"/>
    <rect x="1025" y="916" width="156" height="80" rx="10" class="label-bg"/>
    <text x="1103" y="944" text-anchor="middle" class="edge-label" fill="#fbbf24">USB 双向</text>
    <text x="1103" y="974" text-anchor="middle" class="edge-label" fill="#fbbf24">RSA 授权</text>

    <line x1="1359" y1="700" x2="1359" y2="610" class="connector" stroke="#fb7185"
          marker-end="url(#arrow-phone)"/>
    <rect x="1368" y="628" width="136" height="44" rx="10" class="label-bg"/>
    <text x="1436" y="657" text-anchor="middle" class="edge-label" fill="#fb7185">系统内执行</text>
  </g>

  <g id="legend">
    <rect x="1184" y="915" width="354" height="125" rx="14" fill="#0b1220" stroke="#30363d" stroke-width="1.2"/>
    <text x="1202" y="947" class="mono" font-size="20" font-weight="700" fill="#aab4bf" letter-spacing="1">LEGEND / 图例</text>
    <circle cx="1208" cy="973" r="5" fill="#67e8f9"/>
    <text x="1226" y="980" class="legend">用户交互</text>
    <circle cx="1372" cy="973" r="5" fill="#34d399"/>
    <text x="1390" y="980" class="legend">AI Agent</text>
    <circle cx="1208" cy="1003" r="5" fill="#a78bfa"/>
    <text x="1226" y="1010" class="legend">MCP 控制</text>
    <circle cx="1372" cy="1003" r="5" fill="#fbbf24"/>
    <text x="1390" y="1010" class="legend">ADB / USB</text>
    <circle cx="1208" cy="1033" r="5" fill="#fb7185"/>
    <text x="1226" y="1040" class="legend">手机运行时</text>
    <line x1="1374" y1="1033" x2="1426" y2="1033" stroke="#fb7185" stroke-width="2.5"
          marker-start="url(#arrow-phone)" marker-end="url(#arrow-phone)"/>
  </g>

  <text x="800" y="1170" text-anchor="middle" class="footnote">脱敏版：不包含具体机型、系统版本、账号身份、网络地址、本地路径或设备序列号</text>
</svg>
