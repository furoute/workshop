<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="kb-title kb-desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title id="kb-title">自建知识库架构图</title>
  <desc id="kb-desc">需求方与协调、执行、复核智能体协同，将原位资料转化为可检索证据、可核验判断和可浏览知识库。</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1e293b"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1600" height="1210" fill="#020617"/>
  <rect width="1600" height="1210" fill="url(#dots)"/>

  <!-- 标题 -->
  <text x="60" y="66" font-size="34" font-weight="700" fill="#ffffff">自建知识库 · 架构图</text>
  <rect x="395" y="40" width="150" height="32" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="1.4"/>
  <text x="470" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">落地架构</text>
  <text x="60" y="103" font-size="17" fill="#94a3b8">从原位资料到可检索证据、可核验判断与可浏览 Wiki</text>

  <!-- 左侧：入口与协调 -->
  <rect x="60" y="135" width="310" height="900" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="86" y="171" font-size="20" font-weight="700" fill="#fbbf24">入口与协调</text>

  <rect x="85" y="194" width="260" height="108" rx="10" fill="#111827" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="101" y="226" font-size="23" fill="#94a3b8">▣</text>
  <text x="138" y="229" font-size="19" font-weight="700" fill="#ffffff">需求方</text>
  <text x="138" y="265" font-size="16" fill="#cbd5e1">提出需求 · 验收决策</text>

  <rect x="85" y="322" width="260" height="108" rx="10" fill="#04241c" stroke="#34d399" stroke-width="1.8"/>
  <text x="101" y="354" font-size="21" fill="#34d399">&lt;/&gt;</text>
  <text x="138" y="357" font-size="19" font-weight="700" fill="#ffffff">协调 Agent</text>
  <text x="138" y="393" font-size="16" fill="#cbd5e1">拆步派活 · 首查 · 收口</text>

  <rect x="85" y="450" width="260" height="108" rx="10" fill="#04241c" stroke="#34d399" stroke-width="1.8"/>
  <text x="101" y="482" font-size="21" fill="#34d399">&lt;/&gt;</text>
  <text x="138" y="485" font-size="19" font-weight="700" fill="#ffffff">执行 Agent</text>
  <text x="138" y="521" font-size="16" fill="#cbd5e1">盘点 · 解析 · 建库 · 生成</text>

  <rect x="85" y="578" width="260" height="108" rx="10" fill="#04241c" stroke="#34d399" stroke-width="1.8"/>
  <text x="101" y="610" font-size="21" fill="#34d399">&lt;/&gt;</text>
  <text x="138" y="613" font-size="19" font-weight="700" fill="#ffffff">复核 Agent</text>
  <text x="138" y="649" font-size="16" fill="#cbd5e1">架构评审 · 安全复核</text>

  <rect x="85" y="706" width="260" height="136" rx="10" fill="#261105" stroke="#fb923c" stroke-width="1.8"/>
  <text x="101" y="738" font-size="22" fill="#fb923c">≡</text>
  <text x="138" y="741" font-size="19" font-weight="700" fill="#ffffff">消息与唤醒</text>
  <text x="138" y="778" font-size="16" fill="#cbd5e1">ACP 信箱 + SSH 门铃</text>
  <text x="138" y="812" font-size="16" fill="#fb923c">按需唤醒 · 用完关闭</text>

  <text x="215" y="894" text-anchor="middle" font-size="16" fill="#7d8da1">常开协调 · 按需执行</text>

  <!-- 右侧：四层数据与判断链 -->
  <rect x="400" y="135" width="1140" height="900" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="430" y="171" font-size="20" font-weight="700" fill="#fbbf24">四层数据与判断链</text>

  <!-- 01 事实源 -->
  <rect x="430" y="194" width="1080" height="168" rx="10" fill="#111827" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="456" y="226" font-size="23" fill="#94a3b8">▣</text>
  <text x="524" y="239" font-size="24" font-weight="700" fill="#ffffff">01　事实源 · 原位只读</text>
  <text x="524" y="276" font-size="17" fill="#cbd5e1">原件保留在原文件目录，不搬入展示层</text>
  <text x="524" y="315" font-size="17" fill="#94a3b8">3,326 个文件 · 12.27 GiB</text>

  <line x1="970" y1="362" x2="970" y2="390" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowP)"/>

  <!-- 02 证据层 -->
  <rect x="430" y="396" width="1080" height="168" rx="10" fill="#170b33" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="456" y="428" font-size="23" fill="#a78bfa">▤</text>
  <text x="524" y="441" font-size="24" font-weight="700" fill="#ffffff">02　证据层 · FTS5 主召回</text>
  <text x="524" y="478" font-size="17" fill="#cbd5e1">SQLite + FTS5 · 中文精确检索 · BM25</text>
  <text x="524" y="517" font-size="17" fill="#94a3b8">返回文件、段落与位置</text>

  <line x1="970" y1="564" x2="970" y2="592" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <!-- 03 判断层 -->
  <rect x="430" y="598" width="1080" height="180" rx="10" fill="#04241c" stroke="#34d399" stroke-width="1.8"/>
  <text x="456" y="630" font-size="21" fill="#34d399">&lt;/&gt;</text>
  <text x="524" y="643" font-size="24" font-weight="700" fill="#ffffff">03　判断层 · 卡片主作答</text>
  <text x="524" y="680" font-size="17" fill="#cbd5e1">项目卡 · 主题页 · 决策页 · 问答页</text>
  <text x="524" y="719" font-size="17" fill="#fb7185">证据不足写「状态待核」</text>

  <line x1="970" y1="778" x2="970" y2="808" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 04 展示层 -->
  <rect x="430" y="814" width="700" height="168" rx="10" fill="#03202b" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="456" y="846" font-size="21" fill="#22d3ee">▦</text>
  <text x="520" y="859" font-size="23" font-weight="700" fill="#ffffff">04　展示层 · Obsidian Wiki</text>
  <text x="520" y="896" font-size="17" fill="#cbd5e1">人看卡片与双链 · 非 Agent 主入口</text>
  <text x="520" y="935" font-size="17" fill="#94a3b8">Bases 属性视图 · 无插件可降级</text>

  <rect x="1150" y="814" width="360" height="168" rx="10" fill="#241703" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="1172" y="846" font-size="22" fill="#fbbf24">☁</text>
  <text x="1210" y="859" font-size="20" font-weight="700" fill="#ffffff">Obsidian CLI</text>
  <text x="1210" y="896" font-size="16" fill="#cbd5e1">辅助桥 · 非主入口</text>
  <text x="1210" y="935" font-size="16" fill="#94a3b8">中文命令落文件后取回</text>

  <!-- 实测结果 -->
  <rect x="60" y="1060" width="1480" height="104" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.8"/>
  <text x="88" y="1097" font-size="22" font-weight="700" fill="#ffffff">实测结果</text>
  <text x="88" y="1135" font-size="19" fill="#e2e8f0">3,326 个文件全部有终态 · 292 条双链 / 0 断链</text>
</svg>
