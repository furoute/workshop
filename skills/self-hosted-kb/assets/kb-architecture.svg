<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="kb-title kb-desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title id="kb-title">自建知识库 · 架构</title>
  <desc id="kb-desc">自建知识库分为事实源、证据层、判断层和展示层；Agent 查询 FTS5，人查看 Obsidian。</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#162538" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="900" fill="#07111f"/>
  <rect width="1400" height="900" fill="url(#grid)"/>

  <rect x="679" y="27" width="42" height="5" rx="2.5" fill="#38bdf8"/>
  <text x="700" y="71" text-anchor="middle" font-size="40" font-weight="700" fill="#f8fafc">自建知识库 · 架构</text>
  <text x="700" y="107" text-anchor="middle" font-size="20" fill="#b6c4d3">资料原位只读 · 证据精确召回 · 判断有人负责 · 展示只给人看</text>

  <rect x="530" y="126" width="340" height="42" rx="21" fill="#201707" stroke="#eab308" stroke-width="2"/>
  <text x="700" y="153" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">通道：ACP 信箱 + SSH 门铃</text>

  <g id="fact-source">
    <rect x="48" y="190" width="1304" height="130" rx="14" fill="#0d2233" stroke="#38bdf8" stroke-width="2"/>
    <rect x="48" y="190" width="245" height="130" rx="14" fill="#0c3147"/>
    <path d="M293 190V320" stroke="#38bdf8" stroke-width="2"/>
    <text x="170" y="260" text-anchor="middle" font-size="26" font-weight="700" fill="#7dd3fc">01 · 事实源</text>

    <rect x="311" y="206" width="327" height="98" rx="9" fill="#102b40" stroke="#1f4e69" stroke-width="1.5"/>
    <text x="474" y="246" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">原文件目录</text>
    <text x="474" y="279" text-anchor="middle" font-size="18" fill="#dbeafe">原位保留，只读</text>

    <rect x="652" y="206" width="327" height="98" rx="9" fill="#102b40" stroke="#1f4e69" stroke-width="1.5"/>
    <text x="815" y="246" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">文件规模</text>
    <text x="815" y="279" text-anchor="middle" font-size="18" fill="#dbeafe">12,000+ 文件</text>

    <rect x="993" y="206" width="327" height="98" rx="9" fill="#102b40" stroke="#1f4e69" stroke-width="1.5"/>
    <text x="1156" y="246" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">数据流向</text>
    <text x="1156" y="279" text-anchor="middle" font-size="18" fill="#dbeafe">进入证据抽取</text>
  </g>

  <g id="evidence">
    <rect x="48" y="338" width="1304" height="130" rx="14" fill="#191331" stroke="#a78bfa" stroke-width="2"/>
    <rect x="48" y="338" width="245" height="130" rx="14" fill="#2a2050"/>
    <path d="M293 338V468" stroke="#a78bfa" stroke-width="2"/>
    <text x="170" y="408" text-anchor="middle" font-size="26" font-weight="700" fill="#ddd6fe">02 · 证据层</text>

    <rect x="311" y="354" width="327" height="98" rx="9" fill="#201944" stroke="#44357b" stroke-width="1.5"/>
    <text x="474" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">SQLite + FTS5</text>
    <text x="474" y="427" text-anchor="middle" font-size="18" fill="#ede9fe">关键词精确召回</text>

    <rect x="652" y="354" width="327" height="98" rx="9" fill="#201944" stroke="#44357b" stroke-width="1.5"/>
    <text x="815" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">索引方式</text>
    <text x="815" y="427" text-anchor="middle" font-size="18" fill="#ede9fe">倒排表直接命中</text>

    <rect x="993" y="354" width="327" height="98" rx="9" fill="#201944" stroke="#44357b" stroke-width="1.5"/>
    <text x="1156" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">查询输出</text>
    <text x="1156" y="427" text-anchor="middle" font-size="18" fill="#ede9fe">文件 · 段落 · 位置</text>
  </g>

  <g id="judgment">
    <rect x="48" y="486" width="1304" height="130" rx="14" fill="#0e2723" stroke="#34d399" stroke-width="2"/>
    <rect x="48" y="486" width="245" height="130" rx="14" fill="#123b31"/>
    <path d="M293 486V616" stroke="#34d399" stroke-width="2"/>
    <text x="170" y="556" text-anchor="middle" font-size="26" font-weight="700" fill="#a7f3d0">03 · 判断层</text>

    <rect x="311" y="502" width="327" height="98" rx="9" fill="#113a31" stroke="#236b58" stroke-width="1.5"/>
    <text x="474" y="542" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">实体卡</text>
    <text x="474" y="575" text-anchor="middle" font-size="18" fill="#d1fae5">项目与主题沉淀</text>

    <rect x="652" y="502" width="327" height="98" rx="9" fill="#113a31" stroke="#236b58" stroke-width="1.5"/>
    <text x="815" y="542" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">人工判断</text>
    <text x="815" y="575" text-anchor="middle" font-size="18" fill="#d1fae5">每条结论带证据</text>

    <rect x="993" y="502" width="327" height="98" rx="9" fill="#113a31" stroke="#236b58" stroke-width="1.5"/>
    <text x="1156" y="542" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">不确定项</text>
    <text x="1156" y="575" text-anchor="middle" font-size="18" fill="#d1fae5">标注状态待核</text>
  </g>

  <g id="display">
    <rect x="48" y="634" width="1304" height="130" rx="14" fill="#291f0b" stroke="#fbbf24" stroke-width="2"/>
    <rect x="48" y="634" width="245" height="130" rx="14" fill="#46340e"/>
    <path d="M293 634V764" stroke="#fbbf24" stroke-width="2"/>
    <text x="170" y="704" text-anchor="middle" font-size="26" font-weight="700" fill="#fde68a">04 · 展示层</text>

    <rect x="311" y="650" width="327" height="98" rx="9" fill="#3d2c0d" stroke="#76571a" stroke-width="1.5"/>
    <text x="474" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">Obsidian</text>
    <text x="474" y="723" text-anchor="middle" font-size="18" fill="#fef3c7">卡片与双链</text>

    <rect x="652" y="650" width="327" height="98" rx="9" fill="#3d2c0d" stroke="#76571a" stroke-width="1.5"/>
    <text x="815" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">给人看</text>
    <text x="815" y="723" text-anchor="middle" font-size="18" fill="#fef3c7">浏览、关联、判断</text>

    <rect x="993" y="650" width="327" height="98" rx="9" fill="#3d2c0d" stroke="#76571a" stroke-width="1.5"/>
    <text x="1156" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">入口边界</text>
    <text x="1156" y="723" text-anchor="middle" font-size="18" fill="#fef3c7">Agent 主入口是 FTS5</text>
  </g>

  <line x1="700" y1="780" x2="700" y2="800" stroke="#475569" stroke-width="2"/>
  <rect x="390" y="800" width="620" height="56" rx="28" fill="#111c2d" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="836" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">Agent 查 FTS5 · 人看 Obsidian</text>
</svg>
