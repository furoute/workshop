  <text x="70" y="1041" font-size="12.5" fill="#e2e8f0">后端 / 判断</text>
  <rect x="152" y="1029" width="22" height="15" rx="7" fill="#1e293b"/>
  <text x="163" y="1041" text-anchor="middle" font-size="10.5" fill="#e2e8f0">4</text>

  <rect x="196" y="1028" width="16" height="16" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="218" y="1041" font-size="12.5" fill="#e2e8f0">数据库</text>
  <rect x="268" y="1029" width="22" height="15" rx="7" fill="#1e293b"/>
  <text x="279" y="1041" text-anchor="middle" font-size="10.5" fill="#e2e8f0">1</text>

  <rect x="312" y="1028" width="16" height="16" rx="4" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="334" y="1041" font-size="12.5" fill="#e2e8f0">前端展示</text>
  <rect x="396" y="1029" width="22" height="15" rx="7" fill="#1e293b"/>
  <text x="407" y="1041" text-anchor="middle" font-size="10.5" fill="#e2e8f0">1</text>

  <rect x="440" y="1028" width="16" height="16" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="462" y="1041" font-size="12.5" fill="#e2e8f0">云服务 / 辅助桥</text>
  <rect x="576" y="1029" width="22" height="15" rx="7" fill="#1e293b"/>
  <text x="587" y="1041" text-anchor="middle" font-size="10.5" fill="#e2e8f0">1</text>

  <rect x="620" y="1028" width="16" height="16" rx="4" fill="none" stroke="#fb923c" stroke-width="1.6"/>
  <text x="642" y="1041" font-size="12.5" fill="#e2e8f0">消息总线</text>
  <rect x="704" y="1029" width="22" height="15" rx="7" fill="#1e293b"/>
  <text x="715" y="1041" text-anchor="middle" font-size="10.5" fill="#e2e8f0">1</text>

  <rect x="748" y="1028" width="16" height="16" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="770" y="1041" font-size="12.5" fill="#e2e8f0">外部系统</text>
  <rect x="832" y="1029" width="22" height="15" rx="7" fill="#1e293b"/>
  <text x="843" y="1041" text-anchor="middle" font-size="10.5" fill="#e2e8f0">2</text>

  <text x="48" y="1076" font-size="11.5" fill="#7d8da1">依据：某某中心试点结项说明（2026-10-24）· FTS5 索引影响分析（2026-10-24）· Obsidian CLI 开关记录（2026-10-23）</text>
  <text x="640" y="1128" text-anchor="middle" font-size="13" fill="#94a3b8">与设计稿的区别：四层按建成形态定稿 —— 事实源 / 证据层 / 判断层 / 展示层；向量未上，镜像未建，插件一个没装</text>
  <text x="640" y="1156" text-anchor="middle" font-size="12" fill="#475569">绒毛（muse-cloud）绘制 · 2026-10-24 · 深色版（ACP-lite 拓扑图同款 archify dark 风格）</text>
</svg>
