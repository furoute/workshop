<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="kb-title kb-desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title id="kb-title">自建知识库架构图</title>
  <desc id="kb-desc">需求方与协调、执行、复核智能体协同，将原位资料转化为可检索证据、可核验判断和可浏览知识库。</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e293b"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <style>
    .primary { fill: #f8fafc; }
    .muted { fill: #94a3b8; }
    .dim { fill: #64748b; }
    .faint { fill: #7d8da1; }
    .green { fill: #34d399; }
    .violet { fill: #a78bfa; }
    .cyan { fill: #22d3ee; }
    .amber { fill: #fbbf24; }
    .orange { fill: #fb923c; }
    .red { fill: #fb7185; }
    .card { stroke-width: 1.4; }
    .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
  </style>

  <rect width="1280" height="900" fill="#020617"/>
  <rect width="1280" height="900" fill="url(#dots)"/>

  <!-- Header -->
  <text x="36" y="49" font-size="28" font-weight="700" class="primary">自建知识库 · 架构图</text>
  <rect x="312" y="28" width="112" height="27" rx="13.5" fill="#052e24" stroke="#34d399" stroke-width="1.2"/>
  <text x="368" y="46" text-anchor="middle" font-size="12" font-weight="700" class="green">落地架构</text>
  <text x="36" y="77" font-size="13" class="muted">从原位资料到可检索证据、可核验判断与可浏览 Wiki</text>
  <text x="1244" y="46" text-anchor="end" font-size="11" letter-spacing="1.5" class="dim">SELF-HOSTED KNOWLEDGE BASE</text>
  <line x1="36" y1="92" x2="1244" y2="92" stroke="#1e293b" stroke-width="1"/>

  <!-- Coordination region -->
  <rect x="36" y="112" width="280" height="748" rx="12" fill="#0b1322" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="56" y="140" font-size="14" font-weight="700" class="amber">入口与协调</text>
  <text x="56" y="161" font-size="11" class="muted">需求方 · 智能体角色 · 消息通道</text>

  <!-- Requester -->
  <rect x="56" y="180" width="240" height="96" rx="8" fill="#111827" stroke="#94a3b8" class="card"/>
  <rect x="68" y="193" width="24" height="24" rx="5" fill="#1e293b" stroke="#94a3b8"/>
  <path d="M75 203h10M80 198v10" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="104" y="209" font-size="15" font-weight="700" class="primary">需求方</text>
  <text x="104" y="229" font-size="11.5" class="muted">提出需求 · 验收决策</text>
  <text x="68" y="256" font-size="11.5" class="muted">口述决定与业务判断进入知识库</text>

  <line x1="176" y1="276" x2="176" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Coordinator -->
  <rect x="56" y="294" width="240" height="102" rx="8" fill="#04241c" stroke="#34d399" class="card"/>
  <rect x="68" y="307" width="24" height="24" rx="5" fill="#052e24" stroke="#34d399"/>
  <path d="M75 312l-4 7 4 7M85 312l4 7-4 7" fill="none" stroke="#34d399" stroke-width="1.4" stroke-linecap="round"/>
  <text x="104" y="323" font-size="15" font-weight="700" class="primary">协调 Agent</text>
  <text x="104" y="343" font-size="11.5" class="muted">拆步派活 · 首查 · 收口</text>
  <text x="68" y="368" font-size="11.5" class="muted">维护公共档案与任务上下文</text>
  <text x="68" y="386" font-size="11.5" class="green">公共档案唯一写权限</text>

  <line x1="176" y1="396" x2="176" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Executor -->
  <rect x="56" y="414" width="240" height="112" rx="8" fill="#04241c" stroke="#34d399" class="card"/>
  <rect x="68" y="427" width="24" height="24" rx="5" fill="#052e24" stroke="#34d399"/>
  <path d="M75 432l-4 7 4 7M85 432l4 7-4 7" fill="none" stroke="#34d399" stroke-width="1.4" stroke-linecap="round"/>
  <text x="104" y="443" font-size="15" font-weight="700" class="primary">执行 Agent</text>
  <text x="104" y="463" font-size="11.5" class="muted">盘点 · 解析 · 建库 · 生成</text>
  <text x="68" y="488" font-size="11.5" class="muted">桌面机按需运行；单写者模式</text>
  <text x="68" y="506" font-size="11.5" class="muted">以实测耗时校准自估结果</text>

  <line x1="176" y1="526" x2="176" y2="540" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reviewer -->
  <rect x="56" y="544" width="240" height="96" rx="8" fill="#04241c" stroke="#34d399" class="card"/>
  <rect x="68" y="557" width="24" height="24" rx="5" fill="#052e24" stroke="#34d399"/>
  <path d="M80 561l8 3v5c0 5-4 8-8 10-4-2-8-5-8-10v-5z" fill="none" stroke="#34d399" stroke-width="1.4"/>
  <text x="104" y="573" font-size="15" font-weight="700" class="primary">复核 Agent</text>
  <text x="104" y="593" font-size="11.5" class="muted">架构评审 · 安全复核</text>
  <text x="68" y="620" font-size="11.5" class="muted">只审争议判断，保持独立视角</text>

  <!-- Message bus -->
  <rect x="56" y="658" width="240" height="112" rx="8" fill="#261105" stroke="#fb923c" class="card"/>
  <rect x="68" y="671" width="24" height="24" rx="5" fill="#2b1608" stroke="#fb923c"/>
  <path d="M75 677h10M75 682h10M75 687h10" stroke="#fb923c" stroke-width="1.4" stroke-linecap="round"/>
  <text x="104" y="687" font-size="15" font-weight="700" class="primary">消息与唤醒</text>
  <text x="104" y="707" font-size="11.5" class="muted">ACP 信箱 + SSH 门铃</text>
  <text x="68" y="732" font-size="11.5" class="muted">正文走签名信（msg_id）</text>
  <text x="68" y="750" font-size="11.5" class="muted">门铃只提示「去看信」</text>

  <text x="176" y="809" text-anchor="middle" font-size="11.5" class="faint">按需开机 · 用完关机 · 不做常驻镜像</text>

  <!-- Architecture region -->
  <rect x="336" y="112" width="908" height="748" rx="12" fill="#07101e" stroke="#334155" stroke-width="1.2"/>
  <text x="356" y="140" font-size="14" font-weight="700" class="primary">四层数据与判断链</text>
  <text x="356" y="161" font-size="11" class="muted">事实源 → 证据层 → 判断层 → 展示层</text>
  <text x="1224" y="151" text-anchor="end" font-size="10.5" class="dim">可核验 · 可迁移 · 可降级</text>

  <!-- Layer 1: fact source -->
  <rect x="356" y="180" width="868" height="136" rx="8" fill="#0d1526" stroke="#94a3b8" class="card"/>
  <rect x="372" y="196" width="52" height="46" rx="7" fill="#111827" stroke="#94a3b8"/>
  <path d="M386 211h14l4 4h14v14h-32z" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="216" font-size="17" font-weight="700" class="primary">01　事实源 · 原位资料</text>
  <text x="440" y="239" font-size="11.5" class="muted">Word / Excel / PPT / PDF 原位只读，不搬入展示层</text>
  <text x="372" y="270" font-size="12" class="primary">资料路径：D:\资料盘\某某项目</text>
  <text x="372" y="293" font-size="11.5" class="muted">3,326 个文件 · 12.27 GiB · 正文解析 · SHA-256 去重 · 打印版 PDF 不 OCR</text>
  <rect x="1090" y="202" width="112" height="34" rx="17" fill="#111827" stroke="#64748b"/>
  <text x="1146" y="224" text-anchor="middle" font-size="11.5" class="muted">只读事实源</text>

  <line x1="790" y1="318" x2="790" y2="341" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="804" y="334" font-size="10.5" class="violet">解析正文 · 内容去重</text>

  <!-- Layer 2: evidence -->
  <rect x="356" y="343" width="868" height="136" rx="8" fill="#170b33" stroke="#a78bfa" class="card"/>
  <rect x="372" y="359" width="52" height="46" rx="7" fill="#1d1040" stroke="#a78bfa"/>
  <ellipse cx="398" cy="372" rx="13" ry="5" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <path d="M385 372v19c0 3 6 5 13 5s13-2 13-5v-19M385 382c0 3 6 5 13 5s13-2 13-5" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="440" y="379" font-size="17" font-weight="700" class="primary">02　证据层 · 全文索引</text>
  <text x="440" y="402" font-size="11.5" class="muted">SQLite + FTS5 · 中文 trigram 倒排 · BM25 排序</text>
  <text x="372" y="433" font-size="12" class="primary">Agent 主召回入口：关键词精确命中，返回文件、段落与位置</text>
  <text x="372" y="456" font-size="11.5" class="muted">正文分块 85,716 · 去重内容 2,510 份 · content ↔ occurrence 多对多</text>
  <text x="1090" y="393" text-anchor="middle" font-size="11.5" class="violet">本地可迁移</text>
  <text x="1090" y="416" text-anchor="middle" font-size="11.5" class="muted">doc_id + 相对路径</text>
  <text x="1090" y="439" text-anchor="middle" font-size="11.5" class="muted">+ SHA-256</text>

  <line x1="790" y1="481" x2="790" y2="504" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="804" y="497" font-size="10.5" class="green">据证据生成 · 每条结论带三件套</text>

  <!-- Layer 3: judgment -->
  <rect x="356" y="506" width="868" height="158" rx="8" fill="#04241c" stroke="#34d399" class="card"/>
  <rect x="372" y="522" width="52" height="46" rx="7" fill="#052e24" stroke="#34d399"/>
  <path d="M385 530h26M385 540h26M385 550h18M385 560h22" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <text x="440" y="542" font-size="17" font-weight="700" class="primary">03　判断层 · 卡片主作答</text>
  <text x="440" y="565" font-size="11.5" class="muted">项目卡 · 主题页 · 决策页 · 问答页：人工判断的沉淀</text>
  <text x="372" y="594" font-size="12" class="primary">状态严格枚举，不把推断写成事实：在做 / 已结束 / 分析中；已中标 / 未投标 / 状态待核</text>
  <text x="372" y="617" font-size="11.5" class="muted">证据三件套：doc_id + 相对源根路径 + SHA-256 + locator；口述决定单独标注</text>
  <rect x="372" y="632" width="640" height="22" rx="4" fill="#2a111a" stroke="#fb7185" stroke-width="1"/>
  <text x="384" y="647" font-size="11" class="red">红线：证据不足写「状态待核」；合同额 ≠ 已回款 · 候选人公示 ≠ 已中标 · 报价 ≠ 预算</text>
  <rect x="1048" y="529" width="154" height="34" rx="17" fill="#052e24" stroke="#34d399"/>
  <text x="1125" y="551" text-anchor="middle" font-size="11.5" class="green">可解释判断</text>
  <text x="1125" y="590" text-anchor="middle" font-size="11" class="muted">每页写明</text>
  <text x="1125" y="608" text-anchor="middle" font-size="11" class="muted">证据边界</text>

  <line x1="550" y1="676" x2="550" y2="699" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="692" font-size="10.5" class="muted">组织成 Wiki 供人查阅</text>

  <!-- Layer 4: presentation -->
  <rect x="356" y="701" width="500" height="139" rx="8" fill="#03202b" stroke="#22d3ee" class="card"/>
  <rect x="372" y="717" width="52" height="46" rx="7" fill="#062a36" stroke="#22d3ee"/>
  <rect x="383" y="727" width="30" height="22" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
  <path d="M383 735h30M393 744v6M387 750h12" stroke="#22d3ee" stroke-width="1.3" stroke-linecap="round"/>
  <text x="440" y="737" font-size="17" font-weight="700" class="primary">04　展示层 · 知识库 Wiki</text>
  <text x="440" y="760" font-size="11.5" class="muted">Obsidian：人看卡片与双链，不是 Agent 主入口</text>
  <text x="372" y="789" font-size="12" class="primary">Bases 属性视图 · 按状态浏览项目与问答 · 全库双链导航</text>
  <text x="372" y="812" font-size="11.5" class="muted">无插件降级为纯 Markdown 表格；外部知识库可直接浏览</text>

  <rect x="872" y="701" width="352" height="139" rx="8" fill="#241703" stroke="#fbbf24" class="card"/>
  <rect x="888" y="717" width="52" height="46" rx="7" fill="#2b1c05" stroke="#fbbf24"/>
  <path d="M904 730h16a7 7 0 0 1 0 14h-2M906 738h-6a5 5 0 0 1 0-10h2" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <text x="956" y="737" font-size="16" font-weight="700" class="primary">Obsidian CLI · 辅助桥</text>
  <text x="956" y="760" font-size="11.5" class="muted">活状态 / UI 动作 · 不是主入口</text>
  <text x="888" y="789" font-size="11.5" class="primary">启动前开启命令行界面开关</text>
  <text x="888" y="812" font-size="11.5" class="muted">中文命令经管道易乱码：落文件后取回</text>

  <!-- Footer -->
  <text x="36" y="883" font-size="10.5" class="dim">设计原则：事实源不复制 · 证据可追溯 · 判断有边界 · 展示可降级</text>
  <text x="1244" y="883" text-anchor="end" font-size="10.5" class="dim">深色拓扑样式 · SVG 自包含</text>
</svg>
